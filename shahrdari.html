<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ماشین حساب شهرداری</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>ماشین حساب شهرداری</h1>
<label>سقف تعهد</label>
<div class="technical-options">
<div class="technical-card active" id="generalSpecialtyCard" onclick="selectGeneral()">
<input id="generalSpecialtyRadio" type="radio" name="specialtyType" checked>
<div><strong>عمومی</strong></div>
</div><div class="technical-card" id="specialistSpecialtyCard" onclick="selectSpecialist()">
<input id="specialtyTypeRadio" type="radio" name="specialtyType" >
<div><strong>متخصص</strong></div>
</div></div>
<div id="ceilingSection">
<label>سقف تعهد</label>
<div class="technical-options">
<div class="technical-card active" id="fixedCeilingCard" onclick="selectFixedCeiling()">
<input id="fixedCeilingRadio" type="radio" name="ceilingType" checked>
<div><strong>مبلغ ثابت</strong><br><span>15,000,000 ریال</span></div>
</div>
<div class="technical-card" id="customCeilingCard" onclick="selectCustomCeiling()">
<input id="customCeilingRadio" type="radio" name="ceilingType" >
<div><strong>مبلغ دلخواه</strong><br><span>ورود مبلغ توسط کاربر</span></div>
</div>
</div>
<input id="customCeiling" type="text" inputmode="numeric" disabled placeholder="مبلغ دلخواه سقف تعهد">
</div>

<label>حق فنی</label>
<div class="technical-options">
<div class="technical-card active" id="fixedCard" onclick="selectFixed()"><input id="fixedRadio" type="radio" name="technicalType" checked><div><strong>مبلغ ثابت</strong><br><span>727,000 ریال</span></div></div>
<div class="technical-card" id="customCard" onclick="selectCustom()"><input id="customRadio" type="radio" name="technicalType"><div><strong>مبلغ دلخواه</strong><br><span>ورود مبلغ توسط کاربر</span></div></div>
</div>
<input id="customTechnical" type="text" inputmode="numeric" disabled placeholder="مبلغ دلخواه حق فنی">
<label>خارج تعهد</label><input id="outside" type="text" inputmode="numeric">
<label>فرانشیز</label><input id="franchise" type="text" inputmode="numeric">
<button onclick="calculate()">محاسبه</button>
<div class="result-box">
<h2>مبلغ پرداختی بیمه</h2>
<div id="result">0 ریال</div>
<button onclick="copyResult()" class="copy-btn">کپی مبلغ</button>
</div>
<div class="shortcut-guide">
<span>Enter : رفتن به فیلد بعدی</span>
<span>F2 : کپی مبلغ</span>
<span>F4 : پاک کردن فرم و شروع نسخه جدید</span>
</div>
<a class="back" href="index.html">بازگشت</a>
</div>
<div id="toast" class="toast-message">مبلغ کپی شد</div>
<script src="shahrdari.js"></script></body></html>
