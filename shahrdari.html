<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ماشین حساب شهرداری</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>ماشین حساب شهرداری</h1>


    <!-- حق فنی -->

    <label class="section-title">حق فنی:</label>

    <div class="technical-options">


        <div class="technical-card active" id="fixedCard" onclick="selectFixed()">

            <input type="radio" checked>

            <div>
                <strong>مبلغ ثابت</strong>
                <br>
                <span>727,000 ریال</span>
            </div>

        </div>



        <div class="technical-card" id="customCard" onclick="selectCustom()">

            <input type="radio">

            <div>
                <strong>مبلغ دلخواه</strong>
                <br>
                <span>ورود مبلغ توسط کاربر</span>
            </div>

        </div>


    </div>



    <input
        id="customTechnical"
        type="text"
        inputmode="numeric"
        disabled
        placeholder="مبلغ دلخواه حق فنی"
    >



    <!-- خارج تعهد -->

    <label>خارج تعهد:</label>

    <input
        id="outside"
        type="text"
        inputmode="numeric"
        placeholder="مبلغ خارج تعهد"
    >



    <!-- فرانشیز -->

    <label>فرانشیز:</label>

    <input
        id="franchise"
        type="text"
        inputmode="numeric"
        placeholder="مبلغ فرانشیز"
    >



    <button onclick="calculate()">
        محاسبه
    </button>




    <div class="result-box">

        <h2>
            مبلغ پرداختی بیمه:
        </h2>


        <div id="result">
            0 ریال
        </div>


        <button onclick="copyResult()">
            کپی مبلغ
        </button>


    </div>




    <div class="shortcut-help">
        کلید میانبر: <strong>F2</strong> = کپی مبلغ پرداختی بیمه
    </div>



    <a class="back" href="index.html">
        بازگشت
    </a>



    <div id="toast">
        مبلغ کپی شد
    </div>


</div>



<script src="shahrdari.js"></script>

</body>

</html>
